name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cppcheck \
            libpython3-dev libsqlite3-dev libjson-c-dev pkg-config

      - name: Static analysis
        run: cppcheck --enable=all --inconclusive --quiet src/ index/ mcp/ pycoolctl/ 2>&1 | tee cppcheck.txt; test ! -s cppcheck.txt

      - name: Build
        run: make clean && make

  build:
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper-compat \
            libpython3-dev libsqlite3-dev libjson-c-dev pkg-config

      - name: Build debs
        run: dpkg-buildpackage -us -uc -b

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ../*.deb
            ../*.ddeb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}