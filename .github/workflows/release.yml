name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper-compat \
            libpython3-dev libsqlite3-dev libjson-c-dev pkg-config

      - name: Build debs
        run: dpkg-buildpackage -us -uc -b

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ../*.deb
            ../*.ddeb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}